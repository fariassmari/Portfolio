<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="/src/style.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@700&family=Oxanium:wght@700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.8.5/dist/dotlottie-wc.js"
  type="module"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>portfolio</title>
  <!-- Configuração de cores -->
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    black1: "#0A0A0A",
                    roxo1: "#291C3A",
                    roxo2: "#331C52",
                    roxo3: "#8121D0",
                    lilas: "#DCCFED",
                    gelo: "#E1EBED"
                },
                // ADICIONE ESTA SEÇÃO 'fontFamily'
                fontFamily: {
                    'sans': ['ui-sans-serif', 'system-ui'], // Fonte padrão
                    'tech': ['Oxanium', 'sans-serif'],
                    'orbitron': ['Orbitron', 'sans-serif'],
                    'audiowide': ['Audiowide', 'sans-serif']
                }
            }
        }
    }
  </script>
</head>

<body class="bg-black1 text-white">
  <!-- ========== HEADER ========== -->
  <header class="w-full fixed top-0 left-0 z-40 flex justify-between items-center px-6 md:px-16 py-4 bg-black1/80 backdrop-blur-lg border-b border-roxo3/30">
      <a href="#" class="h-14 md:h-18 flex items-center">
        <h1 class="text-2xl font-bold text-lilas font-orbitron uppercase">
          Mariana F B
        </h1>
      </a>

      <button id="btn-menu" class="text-3xl">☰</button>
  </header>


  <!-- ========== SIDEBAR MOBILE ========== -->
  <aside id="sidebar"
      class="fixed top-0 right-0 w-64 h-full bg-roxo2/40 backdrop-blur-lg border-l border-roxo3/70
            p-8 flex flex-col gap-8 transform translate-x-full transition-all duration-300 z-50">

      <button id="close-sidebar" class="text-4xl self-end -mt-4">×</button>

      <nav class="flex flex-col gap-6 text-lg mt-4">
          <a href="#about" class="hover:text-lilas transition">Sobre</a>
          <a href="#projects" class="hover:text-lilas transition">Projetos</a>
          <a href="#skills" class="hover:text-lilas transition">Skills</a>
          <a href="#experience" class="hover:text-lilas transition">Experiências</a>
          <a href="#contact" class="hover:text-lilas transition">Contato</a>
      </nav>
  </aside>


  <!-- ========== HERO SECTION ========== -->
  <section id="hero"
      class="min-h-screen flex items-center relative pt-32 pb-16 px-10 md:px-20 overflow-hidden">

      <div class="absolute inset-0 bg-gradient-to-b from-black1 via-roxo1 to-black1 z-0 opacity-80"></div>

      <dotlottie-wc
        src="https://lottie.host/0d9bbef4-b3b6-4e14-9431-04c5b45441b1/pEkpudlOfV.lottie" class="absolute inset-0 w-full h-full object-contain z-10 opacity-10 md:opacity-20"
        autoplay
        loop
      ></dotlottie-wc>

      <div class="relative z-20 flex flex-col md:flex-row items-center md:items-start w-full max-w-7xl mx-auto gap-8 lg:gap-16">
          
          <div class="max-w-3xl text-center md:text-left flex-shrink-0">
              <p class="text-roxo3/90 tracking-widest uppercase mb-3">
                  Engenheira de Software
              </p>
              <h1 class="text-6xl md:text-7xl font-bold leading-tight mb-6">
                  Dando vida<br>
                  ao <span class="text-roxo3">código</span>
              </h1>
              <p class="text-lg text-gray-300 max-w-xl leading-relaxed mx-auto md:mx-0">
                  Crio experiências digitais modernas e funcionais com foco em estética e desempenho.
              </p>
              <div class="flex gap-4 mt-10 justify-center md:justify-start">
                  <a href="#projects"
                     class="px-8 py-3 bg-roxo3 rounded-lg hover:bg-roxo2 transition font-medium">
                      Ver Projetos
                  </a>
                  <a href="#contact"
                     class="px-8 py-3 border border-roxo3 rounded-lg hover:bg-roxo2/40 transition font-medium">
                      Contato
                  </a>
              </div>
          </div>

          <div class="relative md:ml-auto md:mr-20 lg:mr-32">
              <div class="w-64 h-64 md:w-72 md:h-72 lg:w-80 lg:h-80 rounded-2xl overflow-hidden shadow-xl bg-black1 border-2 border-roxo2 transform hover:scale-105 transition-transform duration-300">
                  <img src="./Foto - Mariana Farias de Brito - Eletrônica.jpeg" class="w-full h-full object-cover p-3 rounded-3xl" />
              </div>
          </div>

      </div>

      <div class="absolute z-30 bottom-10 right-10 md:right-16 lg:right-24 flex flex-col gap-6 text-lilas/70 text-2xl">
          <a href="#" class="hover:text-lilas transition-colors duration-200" aria-label="LinkedIn">
              <i class="bi bi-linkedin"></i>
          </a>
          <a href="#" class="hover:text-lilas transition-colors duration-200" aria-label="GitHub">
              <i class="bi bi-github"></i>
          </a>
          <a href="#" class="hover:text-lilas transition-colors duration-200" aria-label="Instagram">
              <i class="bi bi-instagram"></i>
          </a>
      </div>

  </section>

  <!-- ========== SCRIPT (FUNCIONA) ========== -->
  <script>
    const sidebar = document.getElementById("sidebar");
    const openBtn = document.getElementById("btn-menu");
    const closeBtn = document.getElementById("close-sidebar");

    openBtn.addEventListener("click", () => {
        sidebar.classList.remove("translate-x-full");
    });

    closeBtn.addEventListener("click", () => {
        sidebar.classList.add("translate-x-full");
    });
  </script>

</main>

</body>
</html>
